<!DOCTYPE html>
<html lang="pt-br" class="bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bolão Inteligente{% endblock %}</title>
    <!-- Importação do Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col">
    <!-- templates/loteria/base.html -->

    <header class="bg-slate-800 shadow-md py-4 px-6 border-b border-slate-700 flex justify-between items-center">
        <!-- Logo / Título que funciona como link para a Home -->
        <a href="{% url 'home' %}" class="text-2xl font-bold text-emerald-400 hover:text-emerald-300 transition-colors">
            🎯 Bolão Tracker
        </a>

        
        
        {% if user.is_authenticated %}
            <div class="flex items-center gap-3 sm:gap-4">
                <span class="text-sm text-slate-300 hidden sm:block">Olá, <strong class="text-white">{{ user.username }}</strong></span>

                <!-- NOVO: Botão Meu Perfil -->
                <a href="{% url 'perfil' %}" title="Meu Perfil" class="flex items-center justify-center text-slate-400 hover:text-emerald-400 transition-colors p-1.5 sm:px-2 rounded">
                    <svg class="w-5 h-5 sm:mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <span class="hidden sm:inline text-sm font-medium">Perfil</span>
                </a>
                
                <!-- NOVO: Botão de Atalho para o Admin (Apenas para Superusuários) -->
                {% if user.is_superuser %}
                    <a href="/admin/" title="Painel de Administração" class="flex items-center justify-center bg-indigo-900/40 hover:bg-indigo-800 border border-indigo-500/50 text-indigo-300 hover:text-white py-1.5 px-3 rounded transition-all shadow-sm">
                        <svg class="w-4 h-4 sm:mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        <span class="hidden sm:inline text-xs font-semibold uppercase tracking-wider">Admin</span>
                    </a>
                {% endif %}

                

                <!-- Botão de Sair (Logout) -->
                <form method="POST" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="text-sm bg-slate-700 hover:bg-slate-600 text-slate-200 py-1.5 px-4 rounded transition-colors border border-slate-600 shadow-sm">
                        Sair
                    </button>
                </form>
            </div>
        {% endif %}
    </header>

    <main class="flex-grow container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-slate-800 text-center py-4 text-sm text-slate-400 border-t border-slate-700">
        <p>&copy; 2026 - Gestão Automatizada de Loterias</p>
    </footer>
</body>
</html>
