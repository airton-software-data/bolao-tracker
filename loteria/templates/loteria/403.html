<!-- templates/loteria/403.html -->
{% extends 'loteria/base.html' %}

{% block title %}Acesso Negado - Bolão Tracker{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col justify-center items-center px-4">
    <div class="w-full max-w-lg bg-slate-800 rounded-2xl shadow-2xl border border-red-900/50 p-8 text-center relative overflow-hidden">
        
        <!-- Efeito visual de fundo -->
        <div class="absolute top-0 left-0 w-full h-2 bg-red-600"></div>
        
        <!-- Ícone de Alerta (Cadeado/Escudo) -->
        <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-full bg-red-900/30 mb-6 border border-red-500/30">
            <svg class="h-10 w-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
            </svg>
        </div>

        <h2 class="text-3xl font-extrabold text-white mb-2">Acesso Negado</h2>
        
        <!-- Mostra a mensagem exata que passamos no 'raise PermissionDenied("...")' -->
        <p class="text-slate-400 mb-8">{{ mensagem }}</p>

        <a href="{% url 'home' %}" class="inline-block bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-lg shadow transition-colors duration-200">
            Voltar para a Tela Inicial
        </a>
    </div>
</div>
{% endblock %}
